<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Holograma Interactivo - 17 de Octubre</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webcam-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        a-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }
        #ui-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 400px;
            text-align: center;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffcc;
            border-radius: 15px;
            padding: 12px 20px;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1rem;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #timer {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.7);
        }
        .party-banner {
            background: linear-gradient(45deg, #ff0055, #ffcc00, #00ffcc);
            color: #000;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.8);
            text-transform: uppercase;
            display: none;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- Video nativo de la cámara trasera -->
    <video id="webcam-video" autoplay playsinline muted></video>

    <!-- Interfaz flotante -->
    <div id="ui-overlay">
        <div class="hud-card" id="card-container">
            <h1>⏳ Faltan para el 17 de Octubre</h1>
            <div id="timer">Cargando...</div>
        </div>
        <div class="party-banner" id="party-banner">
            🎉 ¡LLEGÓ EL 17 DE OCTUBRE! ¡FIESTA BIZARRA! 🎂
        </div>
    </div>

    <!-- Escena 3D con transparencia para mostrar la cámara de fondo -->
    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; logarithmicDepthBuffer: true;">
        
        <a-camera position="0 0 2.5" look-controls="enabled: true"></a-camera>

        <!-- Luces ambientales y de escena -->
        <a-light type="ambient" color="#FFF" intensity="1.3"></a-light>
        <a-light type="directional" position="2 4 2" intensity="1.5"></a-light>

        <!-- CONTENEDOR DEL HOLOGRAMA -->
        <a-entity id="holo-entity" position="0 -0.3 -2">

            <!-- PERSONAJE AMIGABLE BIZARRO -->
            <a-entity id="character" animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
                <!-- Cuerpo -->
                <a-capsule radius="0.22" height="0.7" color="#00ffcc" position="0 0.35 0" roughness="0.2" metalness="0.5">
                    <!-- Ojos -->
                    <a-sphere radius="0.06" color="#ff0055" position="-0.09 0.22 0.2"></a-sphere>
                    <a-sphere radius="0.06" color="#ff0055" position="0.09 0.22 0.2"></a-sphere>
                    <a-sphere radius="0.022" color="#000" position="-0.09 0.22 0.25"></a-sphere>
                    <a-sphere radius="0.022" color="#000" position="0.09 0.22 0.25"></a-sphere>
                    <!-- Sonrisa -->
                    <a-torus arc="180" radius="0.07" radius-tubular="0.012" color="#fff" rotation="0 0 180" position="0 0.08 0.2"></a-torus>
                </a-capsule>

                <!-- Gorrito fiestero -->
                <a-cone radius-bottom="0.28" height="0.4" color="#ff0055" position="0 0.85 0">
                    <a-sphere radius="0.06" color="#ffcc00" position="0 0.22 0"></a-sphere>
                </a-cone>

                <!-- Brazos animados -->
                <a-box width="0.1" height="0.35" depth="0.1" color="#ffcc00" position="-0.32 0.35 0" 
                       animation="property: rotation; to: 45 0 0; dir: alternate; dur: 350; loop: true"></a-box>
                <a-box width="0.1" height="0.35" depth="0.1" color="#ffcc00" position="0.32 0.35 0" 
                       animation="property: rotation; to: -45 0 0; dir: alternate; dur: 350; loop: true"></a-box>
            </a-entity>

            <!-- TORTA CON VELA COQUETA -->
            <a-entity id="torta-container" position="0 -0.35 0.3">
                <a-cylinder radius="0.3" height="0.18" color="#ff66b2" position="0 0.09 0"></a-cylinder>
                <a-cylinder radius="0.32" height="0.06" color="#ffffff" position="0 0.17 0"></a-cylinder>
                <a-cylinder radius="0.03" height="0.22" color="#ffff00" position="0 0.3 0">
                    <a-sphere radius="0.05" color="#ff3300" position="0 0.13 0" 
                              animation="property: scale; to: 1.4 1.4 1.4; dir: alternate; dur: 250; loop: true">
                    </a-sphere>
                </a-cylinder>
            </a-entity>

            <!-- FUEGOS ARTIFICIALES BIZARROS (Se activan el 17 de octubre) -->
            <a-entity id="fuegos" visible="false">
                <a-sphere radius="0.035" color="#ff0055" position="-0.6 1.0 -0.3" animation="property: position; to: -0.6 2.0 -0.3; dir: alternate; dur: 700; loop: true"></a-sphere>
                <a-sphere radius="0.035" color="#00ffcc" position="0.6 1.2 -0.3" animation="property: position; to: 0.6 2.2 -0.3; dir: alternate; dur: 500; loop: true"></a-sphere>
                <a-sphere radius="0.035" color="#ffcc00" position="0 1.5 -0.5" animation="property: position; to: 0 2.5 -0.5; dir: alternate; dur: 600; loop: true"></a-sphere>
            </a-entity>

        </a-entity>

    </a-scene>

    <!-- Script de control de cámara y cuenta regresiva -->
    <script>
        async function iniciarCamara() {
            try {
                const videoElement = document.getElementById('webcam-video');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                videoElement.srcObject = stream;
            } catch (error) {
                console.error("Error al acceder a la cámara:", error);
                alert("Por favor, permití el uso de la cámara en tu navegador para ver la experiencia de realidad aumentada.");
            }
        }

        function actualizarSistema() {
            const ahora = new Date();
            const anioActual = ahora.getFullYear();
            
            // Fecha objetivo: 17 de Octubre
            let objetivo = new Date(anioActual, 9, 17, 0, 0, 0); // Mes 9 es octubre

            if (ahora > new Date(anioActual, 9, 17, 23, 59, 59)) {
                objetivo = new Date(anioActual + 1, 9, 17, 0, 0, 0);
            }

            const esElGranDia = ahora.getDate() === 17 && ahora.getMonth() === 9;

            if (esElGranDia) {
                document.getElementById('card-container').style.display = 'none';
                document.getElementById('party-banner').style.display = 'block';
                document.getElementById('fuegos').setAttribute('visible', 'true');

                // Acelerar la rotación del personaje en modo fiesta bizarra
                const char = document.getElementById('character');
                char.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 1500; easing: linear');
            } else {
                const diferencia = objetivo - ahora;
                const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
                const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
                const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

                document.getElementById('timer').innerText = 
                    `${dias}d ${horas}h ${minutos}m ${segundos}s`;
            }
        }

        // Ejecutar al cargar
        window.addEventListener('load', () => {
            iniciarCamara();
            setInterval(actualizarSistema, 1000);
            actualizarSistema();
        });
    </script>
</body>
</html>
