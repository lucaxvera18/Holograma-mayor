<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Holograma Fiestero - 17 de Octubre</title>
    <!-- A-Frame y componentes de animación avanzada -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webcam-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        a-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }
        #ui-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 400px;
            text-align: center;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ffcc00;
            border-radius: 15px;
            padding: 12px 20px;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 0.95rem;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #timer {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
        }
        .party-banner {
            background: linear-gradient(45deg, #ff0055, #ffcc00, #00ffcc);
            color: #000;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.9);
            text-transform: uppercase;
            display: none;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- Video nativo de la cámara trasera -->
    <video id="webcam-video" autoplay playsinline muted></video>

    <!-- Interfaz flotante de cuenta regresiva / festejo -->
    <div id="ui-overlay">
        <div class="hud-card" id="card-container">
            <h1>⏳ Cuenta Regresiva: 17 de Octubre</h1>
            <div id="timer">Cargando...</div>
        </div>
        <div class="party-banner" id="party-banner">
            🎉 ¡LLEGÓ EL 17 DE OCTUBRE! ¡FIESTA TOTAL! 🎂
        </div>
    </div>

    <!-- Escena 3D -->
    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; logarithmicDepthBuffer: true;">
        
        <a-assets>
            <!-- Modelo 3D amigable y divertido (Robot fiestero animado optimizado) -->
            <a-asset-item id="fiestero-model" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/RobotExpressive/glTF-Binary/RobotExpressive.glb"></a-asset-item>
        </a-assets>

        <a-camera id="camara-user" position="0 0 3" look-controls="enabled: true"></a-camera>

        <!-- Luces potentes estilo escenario -->
        <a-light type="ambient" color="#FFF" intensity="1.5"></a-light>
        <a-light type="directional" position="2 5 3" intensity="2"></a-light>

        <!-- CONTENEDOR PRINCIPAL (Dinámico según distancia) -->
        <a-entity id="holo-entity" position="0 -0.6 -2.2" scale="0.8 0.8 0.8">

            <!-- PERSONAJE 3D BAILANDO CON ANIMACIÓN -->
            <a-entity id="robot" 
                      gltf-model="#fiestero-model" 
                      position="0 0 0" 
                      scale="0.35 0.35 0.35" 
                      animation-mixer="clip: Dance; timeScale: 1.2;">
            </a-entity>

            <!-- CARTEL FLOTANTE "17 DE OCTUBRE" (Sostenido en el espacio AR) -->
            <a-entity position="0 1.6 0" animation="property: position; to: 0 1.7 0; dir: alternate; dur: 1000; loop: true">
                <!-- Fondo del cartel -->
                <a-plane width="1.8" height="0.45" color="#000000" opacity="0.8" material="shader: flat">
                    <a-ring radius-inner="0.8" radius-outer="0.85" color="#ffcc00" material="shader: flat"></a-ring>
                </a-plane>
                <!-- Texto del cartel -->
                <a-text value="17 DE OCTUBRE" align="center" color="#ffcc00" width="3.5" position="0 0 0.02" font="exo2bold"></a-text>
            </a-entity>

            <!-- TORTA CON VELA COQUETA (Visible el 17 de octubre) -->
            <a-entity id="torta-container" position="0 0 0.6" visible="false">
                <a-cylinder radius="0.35" height="0.2" color="#ff66b2" position="0 0.1 0"></a-cylinder>
                <a-cylinder radius="0.37" height="0.06" color="#ffffff" position="0 0.2 0"></a-cylinder>
                <a-cylinder radius="0.035" height="0.25" color="#ffff00" position="0 0.35 0">
                    <!-- Fuego de la vela titilando -->
                    <a-sphere radius="0.06" color="#ff3300" position="0 0.15 0" 
                              animation="property: scale; to: 1.4 1.4 1.4; dir: alternate; dur: 200; loop: true">
                    </a-sphere>
                </a-cylinder>
            </a-entity>

            <!-- FUEGOS ARTIFICIALES (Visibles el 17 de octubre) -->
            <a-entity id="fuegos" visible="false">
                <a-sphere radius="0.05" color="#ff0055" position="-0.8 2.0 0" animation="property: position; to: -0.8 3.2 0; dir: alternate; dur: 600; loop: true"></a-sphere>
                <a-sphere radius="0.05" color="#00ffcc" position="0.8 2.2 0" animation="property: position; to: 0.8 3.4 0; dir: alternate; dur: 450; loop: true"></a-sphere>
                <a-sphere radius="0.05" color="#ffcc00" position="0 2.5 -0.5" animation="property: position; to: 0 3.8 -0.5; dir: alternate; dur: 550; loop: true"></a-sphere>
            </a-entity>

        </a-entity>

    </a-scene>

    <!-- Script de control y escalado inteligente por distancia -->
    <script>
        // Iniciar cámara trasera
        async function iniciarCamara() {
            try {
                const videoElement = document.getElementById('webcam-video');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                videoElement.srcObject = stream;
            } catch (error) {
                console.error("Error al iniciar cámara:", error);
            }
        }

        // Lógica de fechas y modo fiesta
        function actualizarSistema() {
            const ahora = new Date();
            const anioActual = ahora.getFullYear();
            
            // Fecha objetivo: 17 de Octubre
            let objetivo = new Date(anioActual, 9, 17, 0, 0, 0);

            if (ahora > new Date(anioActual, 9, 17, 23, 59, 59)) {
                objetivo = new Date(anioActual + 1, 9, 17, 0, 0, 0);
            }

            const esElGranDia = ahora.getDate() === 17 && ahora.getMonth() === 9;

            if (esElGranDia) {
                document.getElementById('card-container').style.display = 'none';
                document.getElementById('party-banner').style.display = 'block';
                document.getElementById('torta-container').setAttribute('visible', 'true');
                document.getElementById('fuegos').setAttribute('visible', 'true');

                // Cambiar animación del robot a festejo extremo si es el día
                const robot = document.getElementById('robot');
                robot.setAttribute('animation-mixer', 'clip: Jump; timeScale: 1.3;');
            } else {
                const diferencia = objetivo - ahora;
                const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
                const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
                const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

                document.getElementById('timer').innerText = 
                    `${dias}d ${horas}h ${minutos}m ${segundos}s`;
            }
        }

        // Sistema para adaptar el tamaño dinámicamente según la distancia de la cámara
        function ajustarEscalaDinamica() {
            const camara = document.getElementById('camara-user');
            const holoEntity = document.getElementById('holo-entity');
            if (camara && holoEntity) {
                const posCam = camara.object3D.position;
                // Calcular distancia para escalar el holograma de forma proporcional al entorno
                const distancia = Math.sqrt(posCam.x*posCam.x + posCam.y*posCam.y + posCam.z*posCam.z);
                const escalaBase = Math.max(0.5, Math.min(1.5, distancia * 0.4));
                holoEntity.setAttribute('scale', `${escalaBase} ${escalaBase} ${escalaBase}`);
            }
            requestAnimationFrame(ajustarEscalaDinamica);
        }

        window.addEventListener('load', () => {
            iniciarCamara();
            setInterval(actualizarSistema, 1000);
            actualizarSistema();
            ajustarEscalaDinamica();
        });
    </script>
</body>
</html>
