<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Holograma Pizza - 17 de Octubre</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webcam-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        a-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }
        #ui-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 400px;
            text-align: center;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ffcc00;
            border-radius: 15px;
            padding: 12px 20px;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 0.95rem;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #timer {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
        }
        .party-banner {
            background: linear-gradient(45deg, #ff0055, #ffcc00, #00ffcc);
            color: #000;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.9);
            text-transform: uppercase;
            display: none;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- Video de cámara trasera nativo -->
    <video id="webcam-video" autoplay playsinline muted></video>

    <!-- UI Flotante -->
    <div id="ui-overlay">
        <div class="hud-card" id="card-container">
            <h1>⏳ Cuenta Regresiva: 17 de Octubre</h1>
            <div id="timer">Calculando...</div>
        </div>
        <div class="party-banner" id="party-banner">
            🎉 ¡LLEGÓ EL 17 DE OCTUBRE! ¡FIESTA TOTAL! 🎂
        </div>
    </div>

    <!-- Escena AR -->
    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; logarithmicDepthBuffer: true;">
        
        <a-camera position="0 1.5 0" look-controls="enabled: false"></a-camera>

        <!-- Luces -->
        <a-light type="ambient" color="#FFF" intensity="1.2"></a-light>
        <a-light type="directional" position="2 4 3" intensity="1.8"></a-light>

        <!-- CONTENEDOR PRINCIPAL (Fijo a -4 de distancia para que el tamaño sea siempre perfecto) -->
        <a-entity position="0 1 -4">

            <!-- PERSONAJE PIZZA BAILARINA (Creado con geometría para cargar 100% perfecto) -->
            <a-entity id="pizza-character" 
                      animation="property: position; to: 0 0.5 0; dir: alternate; dur: 450; loop: true; easing: easeInOutSine"
                      animation__rot="property: rotation; to: 0 15 0; dir: alternate; dur: 600; loop: true; easing: easeInOutSine">

                <!-- Cuerpo de la pizza (Cono aplastado 3D) -->
                <a-cone radius-bottom="1.2" radius-top="0" height="2.5" color="#fca311" scale="1 1 0.15" position="0 1 0"></a-cone>
                
                <!-- Masa (Borde inferior) -->
                <a-cylinder radius="1.25" height="0.3" color="#d68c45" position="0 -0.2 0" scale="1 1 0.2"></a-cylinder>

                <!-- Pepperonis -->
                <a-cylinder radius="0.18" height="0.1" color="#d90429" position="0 1.2 0.15" rotation="90 0 0"></a-cylinder>
                <a-cylinder radius="0.15" height="0.1" color="#d90429" position="-0.4 0.6 0.18" rotation="90 0 0"></a-cylinder>
                <a-cylinder radius="0.16" height="0.1" color="#d90429" position="0.5 0.4 0.18" rotation="90 0 0"></a-cylinder>

                <!-- Campera de Cuero (Envuelve la base) -->
                <a-cylinder radius="1.1" height="0.9" color="#1a1a1a" position="0 0.25 0" scale="1 1 0.25" material="metalness: 0.8; roughness: 0.2"></a-cylinder>
                <!-- Cierre / Detalles campera -->
                <a-box width="0.05" height="0.9" depth="0.3" color="#666" position="0 0.25 0.2"></a-box>

                <!-- Lentes de sol facheros -->
                <a-cylinder radius="0.22" height="0.1" color="#000" position="-0.3 1.5 0.18" rotation="90 0 0"></a-cylinder>
                <a-cylinder radius="0.22" height="0.1" color="#000" position="0.3 1.5 0.18" rotation="90 0 0"></a-cylinder>
                <a-box width="0.4" height="0.05" depth="0.1" color="#000" position="0 1.5 0.18"></a-box>

                <!-- Sombrero de cumpleaños festivo -->
                <a-cone radius-bottom="0.35" height="0.7" color="#ff0055" position="0 2.6 0"></a-cone>
                <a-sphere radius="0.12" color="#00ffcc" position="0 3.0 0"
                          animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; dur: 300; loop: true"></a-sphere>

                <!-- CARTEL FLOTANTE (Solo texto 3D, sin fondos que colisionen) -->
                <a-entity position="0 -1 0.3">
                    <a-text value="17 DE OCTUBRE" align="center" color="#ffcc00" scale="1.5 1.5 1.5" font="exo2bold" position="0 0 0"></a-text>
                </a-entity>

            </a-entity>

            <!-- TORTA Y FUEGOS ARTIFICIALES (Ocultos hasta el 17) -->
            <a-entity id="party-elements" visible="false">
                <!-- Torta flotando a un lado -->
                <a-entity position="-1.5 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
                    <a-cylinder radius="0.5" height="0.3" color="#ff66b2" position="0 0 0"></a-cylinder>
                    <a-cylinder radius="0.52" height="0.1" color="#ffffff" position="0 0.15 0"></a-cylinder>
                    <a-cylinder radius="0.05" height="0.3" color="#ffff00" position="0 0.35 0">
                        <a-sphere radius="0.08" color="#ff3300" position="0 0.2 0" animation="property: scale; to: 1.4 1.4 1.4; dir: alternate; dur: 200; loop: true"></a-sphere>
                    </a-cylinder>
                </a-entity>

                <!-- Fuegos Artificiales -->
                <a-sphere radius="0.08" color="#ff0055" position="-1.5 3 0" animation="property: position; to: -1.5 5 0; dir: alternate; dur: 600; loop: true"></a-sphere>
                <a-sphere radius="0.08" color="#00ffcc" position="1.5 2.5 0" animation="property: position; to: 1.5 4.5 0; dir: alternate; dur: 450; loop: true"></a-sphere>
                <a-sphere radius="0.08" color="#ffcc00" position="0 4 -1" animation="property: position; to: 0 6 -1; dir: alternate; dur: 550; loop: true"></a-sphere>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        // Iniciar cámara web
        async function iniciarCamara() {
            try {
                const videoElement = document.getElementById('webcam-video');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                videoElement.srcObject = stream;
            } catch (error) {
                console.error("Error cámara:", error);
            }
        }

        function actualizarSistema() {
            const ahora = new Date();
            const anioActual = ahora.getFullYear();
            
            // Objetivo: 17 de Octubre
            let objetivo = new Date(anioActual, 9, 17, 0, 0, 0);

            if (ahora > new Date(anioActual, 9, 17, 23, 59, 59)) {
                objetivo = new Date(anioActual + 1, 9, 17, 0, 0, 0);
            }

            const esElGranDia = ahora.getDate() === 17 && ahora.getMonth() === 9;

            if (esElGranDia) {
                document.getElementById('card-container').style.display = 'none';
                document.getElementById('party-banner').style.display = 'block';
                document.getElementById('party-elements').setAttribute('visible', 'true');

                // Hacer que la pizza baile mucho más rápido
                const pizza = document.getElementById('pizza-character');
                pizza.setAttribute('animation', 'property: position; to: 0 1 0; dir: alternate; dur: 200; loop: true; easing: easeInOutSine');
                pizza.setAttribute('animation__rot', 'property: rotation; to: 0 360 0; loop: true; dur: 1000; easing: linear');
            } else {
                const diferencia = objetivo - ahora;
                const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
                const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
                const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

                document.getElementById('timer').innerText = 
                    `${dias}d ${horas}h ${minutos}m ${segundos}s`;
            }
        }

        window.addEventListener('load', () => {
            iniciarCamara();
            setInterval(actualizarSistema, 1000);
            actualizarSistema();
        });
    </script>
</body>
</html>
