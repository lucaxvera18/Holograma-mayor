<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Holograma Pizza Steve - 17 de Octubre</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #webcam-video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
        a-scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; }
        #ui-overlay {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; width: 90%; max-width: 400px; text-align: center; pointer-events: none;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.85); border: 2px solid #ffcc00; border-radius: 15px;
            padding: 12px 20px; color: #fff; box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            backdrop-filter: blur(5px); pointer-events: auto;
        }
        h1 { margin: 0 0 5px 0; font-size: 0.95rem; color: #ffcc00; text-transform: uppercase; letter-spacing: 1px; }
        #timer { font-size: 1.5rem; font-weight: bold; color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.7); }
        .party-banner {
            background: linear-gradient(45deg, #ff0055, #ffcc00, #00ffcc); color: #000; font-weight: 900;
            font-size: 1.1rem; padding: 12px 20px; border-radius: 30px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.9); text-transform: uppercase; display: none; pointer-events: auto;
        }
    </style>
</head>
<body>

    <video id="webcam-video" autoplay playsinline muted></video>

    <div id="ui-overlay">
        <div class="hud-card" id="card-container">
            <h1>⏳ Cuenta Regresiva: 17 de Octubre</h1>
            <div id="timer">Calculando...</div>
        </div>
        <div class="party-banner" id="party-banner">
            🎉 ¡LLEGÓ EL 17 DE OCTUBRE! ¡FIESTA TOTAL! 🎂
        </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; logarithmicDepthBuffer: true;">
        <a-camera position="0 1.5 0" look-controls="enabled: false"></a-camera>
        <a-light type="ambient" color="#FFF" intensity="1.3"></a-light>
        <a-light type="directional" position="2 4 3" intensity="1.8"></a-light>

        <!-- CONTENEDOR PRINCIPAL: Fijo en el espacio frente a la cámara -->
        <a-entity position="0 1.8 -4.5">

            <!-- PIZZA STEVE (Animación de flote dinámico) -->
            <a-entity id="pizza-character" 
                      animation="property: position; to: 0 0.3 0; dir: alternate; dur: 1200; loop: true; easing: easeInOutSine"
                      animation__rot="property: rotation; from: 0 -10 0; to: 0 10 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">

                <!-- Cuerpo: Porción de pizza invertida (Queso) -->
                <a-cone radius-bottom="1.4" radius-top="0" height="2.8" color="#fca311" rotation="0 0 180" scale="1 1 0.15"></a-cone>
                
                <!-- Borde de masa en la parte superior -->
                <a-cylinder radius="1.45" height="0.35" color="#d68c45" position="0 1.4 0" scale="1 1 0.2"></a-cylinder>

                <!-- Pepperonis -->
                <a-cylinder radius="0.22" height="0.05" color="#cc0000" position="0 0.5 0.16" rotation="90 0 0"></a-cylinder>
                <a-cylinder radius="0.18" height="0.05" color="#cc0000" position="-0.4 0.9 0.16" rotation="90 0 0"></a-cylinder>
                <a-cylinder radius="0.2" height="0.05" color="#cc0000" position="0.3 1.1 0.16" rotation="90 0 0"></a-cylinder>
                <a-cylinder radius="0.15" height="0.05" color="#cc0000" position="0 -0.4 0.11" rotation="90 0 0"></a-cylinder>

                <!-- Lentes de Sol Facheros -->
                <a-entity position="0 0.8 0.18">
                    <a-cylinder radius="0.25" height="0.1" color="#111" position="-0.3 0 0" rotation="90 0 0"></a-cylinder>
                    <a-cylinder radius="0.25" height="0.1" color="#111" position="0.3 0 0" rotation="90 0 0"></a-cylinder>
                    <a-box width="0.4" height="0.05" depth="0.1" color="#111" position="0 0 0"></a-box>
                </a-entity>

                <!-- Sonrisa canchera -->
                <a-torus arc="150" radius="0.15" radius-tubular="0.02" color="#000" rotation="0 0 30" position="0 0.3 0.18"></a-torus>

                <!-- BRAZOS SOSTENIENDO EL CARTEL -->
                <!-- Brazo Izquierdo -->
                <a-entity position="-0.5 0 0">
                    <a-cylinder radius="0.03" height="0.6" rotation="0 0 90" position="-0.3 0 0" color="#000"></a-cylinder>
                    <a-cylinder radius="0.03" height="0.8" rotation="90 0 0" position="-0.6 0 0.4" color="#000"></a-cylinder>
                    <!-- Guante blanco sosteniendo la esquina -->
                    <a-sphere radius="0.08" color="#fff" position="-0.6 0 0.8"></a-sphere> 
                </a-entity>
                <!-- Brazo Derecho -->
                <a-entity position="0.5 0 0">
                    <a-cylinder radius="0.03" height="0.6" rotation="0 0 90" position="0.3 0 0" color="#000"></a-cylinder>
                    <a-cylinder radius="0.03" height="0.8" rotation="90 0 0" position="0.6 0 0.4" color="#000"></a-cylinder>
                    <!-- Guante blanco sosteniendo la esquina -->
                    <a-sphere radius="0.08" color="#fff" position="0.6 0 0.8"></a-sphere>
                </a-entity>

                <!-- CARTEL EN LAS MANOS -->
                <a-entity position="0 0 0.82">
                    <a-box width="1.6" height="0.5" depth="0.05" color="#000" position="0 0 0" material="shader: flat">
                        <a-box width="1.5" height="0.4" depth="0.06" color="#ffcc00" position="0 0 0" material="shader: flat"></a-box>
                    </a-box>
                    <a-text value="17 DE OCTUBRE" align="center" color="#000" scale="1.1 1.1 1.1" font="exo2bold" position="0 0 0.04"></a-text>
                </a-entity>

                <!-- PIERNAS Y ZAPATILLAS (Con animación de balanceo suelto) -->
                <a-entity animation="property: rotation; from: -5 0 0; to: 5 0 0; dir: alternate; dur: 800; loop: true">
                    <!-- Pierna Izquierda -->
                    <a-entity position="-0.2 -1.2 0">
                        <a-cylinder radius="0.03" height="1" color="#000" position="0 -0.5 0"></a-cylinder>
                        <a-entity position="0 -1 0.1">
                            <a-box width="0.15" height="0.12" depth="0.3" color="#e63946"></a-box> <!-- Zapatilla -->
                            <a-box width="0.16" height="0.04" depth="0.32" color="#fff" position="0 -0.06 0"></a-box> <!-- Suela blanca -->
                        </a-entity>
                    </a-entity>
                    <!-- Pierna Derecha -->
                    <a-entity position="0.2 -1.2 0">
                        <a-cylinder radius="0.03" height="1" color="#000" position="0 -0.5 0"></a-cylinder>
                        <a-entity position="0 -1 0.1">
                            <a-box width="0.15" height="0.12" depth="0.3" color="#e63946"></a-box>
                            <a-box width="0.16" height="0.04" depth="0.32" color="#fff" position="0 -0.06 0"></a-box>
                        </a-entity>
                    </a-entity>
                </a-entity>

            </a-entity>

            <!-- ELEMENTOS DE FIESTA: TORTA Y FUEGOS (Aparecen el 17) -->
            <a-entity id="party-elements" visible="false">
                <a-entity position="-1.8 -0.5 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
                    <a-cylinder radius="0.5" height="0.3" color="#ff66b2" position="0 0 0"></a-cylinder>
                    <a-cylinder radius="0.52" height="0.1" color="#ffffff" position="0 0.15 0"></a-cylinder>
                    <a-cylinder radius="0.05" height="0.3" color="#ffff00" position="0 0.35 0">
                        <a-sphere radius="0.08" color="#ff3300" position="0 0.2 0" animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; dur: 150; loop: true"></a-sphere>
                    </a-cylinder>
                </a-entity>

                <a-sphere radius="0.08" color="#ff0055" position="-1.5 3 0" animation="property: position; to: -1.5 5 0; dir: alternate; dur: 600; loop: true"></a-sphere>
                <a-sphere radius="0.08" color="#00ffcc" position="1.5 2.5 0" animation="property: position; to: 1.5 4.5 0; dir: alternate; dur: 450; loop: true"></a-sphere>
                <a-sphere radius="0.08" color="#ffcc00" position="0 4 -1" animation="property: position; to: 0 6 -1; dir: alternate; dur: 550; loop: true"></a-sphere>
            </a-entity>

        </a-entity>
    </a-scene>

    <script>
        async function iniciarCamara() {
            try {
                const videoElement = document.getElementById('webcam-video');
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                videoElement.srcObject = stream;
            } catch (error) { console.error("Error cámara:", error); }
        }

        function actualizarSistema() {
            const ahora = new Date();
            const anioActual = ahora.getFullYear();
            let objetivo = new Date(anioActual, 9, 17, 0, 0, 0); // 17 de Octubre

            if (ahora > new Date(anioActual, 9, 17, 23, 59, 59)) {
                objetivo = new Date(anioActual + 1, 9, 17, 0, 0, 0);
            }

            const esElGranDia = ahora.getDate() === 17 && ahora.getMonth() === 9;

            if (esElGranDia) {
                document.getElementById('card-container').style.display = 'none';
                document.getElementById('party-banner').style.display = 'block';
                document.getElementById('party-elements').setAttribute('visible', 'true');

                // Animación de giro loco de festejo
                const pizza = document.getElementById('pizza-character');
                pizza.setAttribute('animation__rot', 'property: rotation; to: 0 360 0; loop: true; dur: 800; easing: linear');
            } else {
                const diferencia = objetivo - ahora;
                const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
                const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
                const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);
                document.getElementById('timer').innerText = `${dias}d ${horas}h ${minutos}m ${segundos}s`;
            }
        }

        window.addEventListener('load', () => {
            iniciarCamara();
            setInterval(actualizarSistema, 1000);
            actualizarSistema();
        });
    </script>
</body>
</html>
