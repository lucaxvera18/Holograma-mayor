<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Holograma AR - 17 de Octubre</title>
    <!-- A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 400px;
            text-align: center;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ffcc;
            border-radius: 15px;
            padding: 12px 20px;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            backdrop-filter: blur(5px);
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1rem;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #timer {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.7);
        }
        .party-banner {
            background: linear-gradient(45deg, #ff0055, #ffcc00, #00ffcc);
            color: #000;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.8);
            text-transform: uppercase;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Interfaz flotante arriba -->
    <div id="ui-overlay">
        <div class="hud-card" id="card-container">
            <h1>⏳ Faltan para el 17 de Octubre</h1>
            <div id="timer">Cargando...</div>
        </div>
        <div class="party-banner" id="party-banner">
            🎉 ¡LLEGÓ EL 17 DE OCTUBRE! 🎂
        </div>
    </div>

    <!-- Escena de Realidad Aumentada con MindAR -->
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/examples/image-tracking/assets/card-example/card.mind;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: true">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Anclado al objetivo detectado por la cámara -->
        <a-entity mindar-image-target="targetIndex: 0">

            <!-- PERSONAJE AMIGABLE BIZARRO -->
            <a-entity id="character" position="0 0.4 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
                <!-- Cuerpo -->
                <a-capsule radius="0.2" height="0.6" color="#00ffcc" position="0 0.3 0">
                    <a-sphere radius="0.05" color="#ff0055" position="-0.08 0.2 0.18"></a-sphere>
                    <a-sphere radius="0.05" color="#ff0055" position="0.08 0.2 0.18"></a-sphere>
                    <a-sphere radius="0.02" color="#000" position="-0.08 0.2 0.22"></a-sphere>
                    <a-sphere radius="0.02" color="#000" position="0.08 0.2 0.22"></a-sphere>
                    <a-torus arc="180" radius="0.06" radius-tubular="0.01" color="#fff" rotation="0 0 180" position="0 0.08 0.18"></a-torus>
                </a-capsule>

                <!-- Gorrito fiestero -->
                <a-cone radius-bottom="0.25" height="0.35" color="#ff0055" position="0 0.75 0">
                    <a-sphere radius="0.05" color="#ffcc00" position="0 0.2 0"></a-sphere>
                </a-cone>

                <!-- Brazos -->
                <a-box width="0.1" height="0.3" depth="0.1" color="#ffcc00" position="-0.28 0.3 0" 
                       animation="property: rotation; to: 45 0 0; dir: alternate; dur: 350; loop: true"></a-box>
                <a-box width="0.1" height="0.3" depth="0.1" color="#ffcc00" position="0.28 0.3 0" 
                       animation="property: rotation; to: -45 0 0; dir: alternate; dur: 350; loop: true"></a-box>
            </a-entity>

            <!-- TORTA CON VELA COQUETA -->
            <a-entity id="torta-container" position="0 0 -0.2">
                <a-cylinder radius="0.25" height="0.15" color="#ff66b2" position="0 0.07 0"></a-cylinder>
                <a-cylinder radius="0.27" height="0.06" color="#ffffff" position="0 0.14 0"></a-cylinder>
                <a-cylinder radius="0.025" height="0.2" color="#ffff00" position="0 0.26 0">
                    <a-sphere radius="0.04" color="#ff3300" position="0 0.12 0" 
                              animation="property: scale; to: 1.4 1.4 1.4; dir: alternate; dur: 250; loop: true">
                    </a-sphere>
                </a-cylinder>
            </a-entity>

            <!-- FUEGOS ARTIFICIALES (Se activan el 17) -->
            <a-entity id="fuegos" visible="false">
                <a-sphere radius="0.03" color="#ff0055" position="-0.5 0.8 0" animation="property: position; to: -0.5 1.5 0; dir: alternate; dur: 700; loop: true"></a-sphere>
                <a-sphere radius="0.03" color="#00ffcc" position="0.5 1.0 0" animation="property: position; to: 0.5 1.7 0; dir: alternate; dur: 500; loop: true"></a-sphere>
                <a-sphere radius="0.03" color="#ffcc00" position="0 1.2 -0.2" animation="property: position; to: 0 1.9 -0.2; dir: alternate; dur: 600; loop: true"></a-sphere>
            </a-entity>

        </a-entity>
    </a-scene>

    <!-- Script de lógica de fechas -->
    <script>
        function actualizarSistema() {
            const ahora = new Date();
            const anioActual = ahora.getFullYear();
            
            // Fecha objetivo: 17 de Octubre
            let objetivo = new Date(anioActual, 9, 17, 0, 0, 0);

            if (ahora > new Date(anioActual, 9, 17, 23, 59, 59)) {
                objetivo = new Date(anioActual + 1, 9, 17, 0, 0, 0);
            }

            const esElGranDia = ahora.getDate() === 17 && ahora.getMonth() === 9;

            if (esElGranDia) {
                document.getElementById('card-container').style.display = 'none';
                document.getElementById('party-banner').style.display = 'block';
                document.getElementById('fuegos').setAttribute('visible', 'true');

                const char = document.getElementById('character');
                char.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 1500; easing: linear');
            } else {
                const diferencia = objetivo - ahora;
                const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
                const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
                const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

                document.getElementById('timer').innerText = 
                    `${dias}d ${horas}h ${minutos}m ${segundos}s`;
            }
        }

        setInterval(actualizarSistema, 1000);
        actualizarSistema();
    </script>
</body>
</html>
